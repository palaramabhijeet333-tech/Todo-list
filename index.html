<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-app">
        <h1>Todo List</h1>
        <p>Track Your Todo's and stay productive</p>
        <div class="input-area">
            <input type="text"  id="input">
            <button id="add">Add</button>
        </div>
        <div class="error" id="error">You  can not add empty todo</div>
        <div class="list-container" id="listContainer">
            <ul id="ulList">
            </ul>
        </div>
        <footer><div class="totalTodos">Todos:<span id="totalTodosThere">0</span>/<span id="totalTodosDoen">0</span> </div><div class="progress-bar"> <div id="progress"></div> </div></footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
